<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Librería - Libro</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">📚 Librería</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row">
            <div class="col-md-4">
                <img id="portada" src="https://via.placeholder.com/300x450" class="img-fluid rounded" alt="Portada">
            </div>
            <div class="col-md-8">
                <h1 id="titulo">Cargando...</h1>
                <h5 id="autor" class="text-muted"></h5>
                <p id="descripcion" class="mt-3"></p>
                <h4 class="mt-3" id="precio"></h4>
                <div class="mt-4">
                    <button class="btn btn-primary me-2">Comprar</button>
                    <a href="catalogo.html" class="btn btn-outline-secondary">Volver al catálogo</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const isbn = params.get("isbn");

        if (isbn) {
            fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`)
                .then(res => res.json())
                .then(data => {
                    const libro = data[`ISBN:${isbn}`];
                    if (libro) {
                        document.getElementById("titulo").textContent = libro.title;
                        document.getElementById("autor").textContent = libro.authors ? libro.authors[0].name : "Autor desconocido";
                        document.getElementById("descripcion").textContent = libro.excerpts ? libro.excerpts[0].text : "Sin descripción disponible.";
                        document.getElementById("portada").src = libro.cover ? libro.cover.large : "https://via.placeholder.com/300x450";
                    }
                });
        }
    </script>
</body>
</html>
